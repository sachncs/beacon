[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon"
version = "0.2.0"
description = "Training-free Sliding Window Attention with sinks (Jolicoeur-Martineau et al., 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "beacon reproduction"}]
dependencies = [
    "torch>=2.1",
    "transformers>=4.55",
    "numpy>=1.24",
    "lm-eval>=0.4.3",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.scripts]
beacon-eval = "beacon.cli:main"

[tool.setuptools]
packages = ["beacon"]

[tool.setuptools.package-data]
beacon = ["py.typed"]