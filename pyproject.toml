[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "beacon"
version = "0.2.0"
description = "Training-free Sliding Window Attention with sinks (Jolicoeur-Martineau et al., 2026)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "beacon reproduction"}]
dependencies = [
    "torch>=2.1",
    "transformers>=4.55",
    "numpy>=1.24",
    "lm-eval>=0.4.3",
    "huggingface_hub>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
beacon-eval = "beacon.cli:main"

[tool.setuptools]
packages = ["beacon"]

[tool.setuptools.package-data]
beacon = ["py.typed"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
files = ["beacon"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_return_any = false
strict_optional = false
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "transformers.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]